server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://openmetadata-server:8585/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # /docs iframe: DocsView embeds /api/swagger-ui (iframe src, no trailing
    # slash) and fetches /api/swagger.json. Neither is under /api/ upstream
    # (the server serves /swagger-ui and /swagger.json at its root), so they
    # need their own locations. The location is /api/swagger-ui WITHOUT a
    # trailing slash so the bare iframe src matches too (a /api/swagger-ui/
    # location would not match it and it would fall through to /api/ and 404
    # upstream). proxy_pass with a URI replaces the matched prefix, so
    # /api/swagger-ui/index.html maps to /swagger-ui/index.html upstream.
    location /api/swagger-ui {
        proxy_pass http://openmetadata-server:8585/swagger-ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /api/swagger.json {
        proxy_pass http://openmetadata-server:8585/swagger.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
