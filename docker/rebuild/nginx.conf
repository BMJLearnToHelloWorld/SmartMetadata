server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # OM SwaggerPage uses ./swagger.json at the UI origin (public AssetServlet
    # document). Rebuild serves the Vue SPA from this nginx, so mirror that URL
    # by proxying to Jersey. JwtFilter excludes swagger.json/.yaml so the
    # document fetch does not need Authorization (RapiDoc never sends api-key
    # on the initial spec load).
    location = /swagger.json {
        proxy_pass http://openmetadata-server:8585/api/swagger.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /swagger.yaml {
        proxy_pass http://openmetadata-server:8585/api/swagger.yaml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://openmetadata-server:8585/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
