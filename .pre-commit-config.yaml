default_language_version:
  python: python3
# `pre-commit install` also installs the pre-push hook java-impact-map needs; every other
# hook keeps running at commit only.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
        # TODO: investigate and fix or remove the excluded files. The first
        # three carry real JSON issues (duplicate keys, malformed/empty
        # content) that pre-commit-hooks v2.3.0 didn't catch; v5.0.0 does.
        # The last is an intentionally malformed test fixture.
        exclude: |
          (?x)^(
            .*vscode.*|
            openmetadata-spec/src/main/resources/rdf/contexts/dataAsset\.jsonld|
            ingestion/examples/sample_data/pipelines/tasks\.json|
            openmetadata-service/src/main/resources/dataInsights/opensearch/indexSettingsTemplate\.json|
            openmetadata-ui/src/main/resources/ui/playwright/test-data/odcs-examples/invalid-malformed\.json
          )$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        files: ^(ingestion|openmetadata-airflow-apis)/
        args: ["--fix", "--config", "ingestion/pyproject.toml"]
      - id: ruff-format
        files: ^(ingestion|openmetadata-airflow-apis)/
        args: ["--config", "ingestion/pyproject.toml"]
      - id: ruff-check
        name: ruff-check (smartmetadata-ingestion)
        files: ^smartmetadata-ingestion/
        args: ["--fix", "--config", "smartmetadata-ingestion/pyproject.toml"]
      - id: ruff-format
        name: ruff-format (smartmetadata-ingestion)
        files: ^smartmetadata-ingestion/
        args: ["--config", "smartmetadata-ingestion/pyproject.toml"]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.5.1
    hooks:
      - id: prettier
        files: ^openmetadata-service/src/main/resources/json/schema/
  - repo: local
    hooks:
      - id: google-style-java
        name: Google Java Code Style for Java
        description: Formats code in Google's Java codestyle with 120 line length.
        entry: scripts/format-code.sh
        language: script
        files: \.java$
        require_serial: true
      - id: token-audit
        name: Design token audit (no hardcoded CSS values)
        description: Fails if committed UI CSS/LESS contains hardcoded colors or spacing instead of design tokens. See openmetadata-ui/src/main/resources/ui/specs/.
        entry: node openmetadata-ui/src/main/resources/ui/scripts/token-audit.js
        language: system
        files: ^openmetadata-ui/src/main/resources/ui/src/.*\.(less|css)$
        require_serial: true
      - id: token-drift
        name: Design token drift (generated files, token refs, spec links)
        description: Fails if tokens.css / token-reference.md are stale (run yarn token-gen), a referenced token is undefined, or a component spec links to a missing file.
        entry: node openmetadata-ui/src/main/resources/ui/scripts/design-tokens/check-drift.js
        language: system
        files: ^openmetadata-ui/src/main/resources/ui/(src/styles/tokens\.css|src/.*\.(less|css)|specs/.*\.md)$
        pass_filenames: false
        require_serial: true
      - id: ui-prettier
        name: Prettier (UI)
        description: Fails if changed UI TS/TSX/JS/JSX/JSON is not prettier-formatted (matches CI ui-checkstyle). Fix with `yarn --cwd openmetadata-ui/src/main/resources/ui ui-checkstyle:changed`.
        entry: scripts/check-ui-format.sh
        language: script
        files: ^(openmetadata-ui/src/main/resources/ui/(src|playwright)|openmetadata-ui-core-components/src/main/resources/ui/src)/.*\.(ts|tsx|js|jsx|json)$
        exclude: /(generated|jsons)/
        require_serial: true
      - id: ui-license-header
        name: Apache-2.0 license header (UI)
        description: Fails if a changed UI source file is missing the Apache-2.0 header (matches CI ui-checkstyle). Fix with `yarn --cwd openmetadata-ui/src/main/resources/ui license-header-fix`.
        entry: scripts/check-ui-license.sh
        language: script
        files: ^(openmetadata-ui/src/main/resources/ui/(src|playwright)|openmetadata-ui-core-components/src/main/resources/ui/src)/.*\.(ts|tsx|js|jsx)$
        exclude: /generated/
        require_serial: true
      - id: tw-audit
        name: Tailwind audit (no hardcoded values in TSX)
        description: Fails if committed .tsx/.ts uses arbitrary Tailwind color/spacing/radius values that map to a design-system utility (e.g. tw:bg-[#2e90fa] -> tw:bg-brand-500).
        entry: node openmetadata-ui/src/main/resources/ui/scripts/tw-audit.js
        language: system
        files: ^openmetadata-ui/src/main/resources/ui/src/.*\.(tsx|ts|jsx|js)$
        require_serial: true
      - id: tw-deprecation-guard
        name: Antd + Less + raw-SVG deprecation guard (no new debt)
        description: Fails if a change adds a new .less file, a new `import ... from 'antd'`, a new assets/svg .svg file, or a new import from assets/svg. Existing usage is fine; use UntitledUI + Tailwind + @openmetadata/ui-core-components/icons for new work.
        entry: node openmetadata-ui/src/main/resources/ui/scripts/tw-deprecation-guard.js
        language: system
        files: ^openmetadata-ui/src/main/resources/ui/src/.*\.(tsx|ts|jsx|js|less|svg)$
        pass_filenames: false
        require_serial: true
      - id: core-components-i18n
        name: core-components i18n checks (gates 1+2+3)
        description: Fails if core-components `t()` keys, locale files, or the language-set are out of sync. Run `yarn check-i18n-all` in openmetadata-ui-core-components/src/main/resources/ui.
        entry: bash -c 'cd openmetadata-ui-core-components/src/main/resources/ui && yarn check-i18n-all'
        language: system
        files: ^openmetadata-ui-core-components/src/main/resources/ui/src/.*\.(ts|tsx|json)$
        pass_filenames: false
      - id: decision-records
        name: Decision records (docs/decisions/ format, ADR citations)
        description: Fails if a record under docs/decisions/ breaks the format, or an ADR citation or docs/decisions/ path in any tracked file resolves to no record. See docs/decisions/README.md.
        entry: python3 scripts/harness/check_decision_records.py
        language: system
        pass_filenames: false
        require_serial: true
      - id: ccl-free-dist
        name: Shippable dist must not depend on CCL modules
        description: Fails if openmetadata-dist declares or packages openmetadata-ui, openmetadata-mcp, ui-core-components, or ingestion. See docs/rebuild/PHASE0.md.
        entry: python3 scripts/rebuild/check_ccl_free_dist.py
        language: system
        files: ^(openmetadata-dist/|scripts/rebuild/check_ccl_free_dist\.py)
        pass_filenames: false
        require_serial: true
      - id: ccl-free-ingestion
        name: Clean-room ingestion must not import CCL packages
        description: Fails if smartmetadata-ingestion depends on or imports openmetadata-ingestion / metadata / openmetadata-airflow-apis. See docs/rebuild/PHASE6.md.
        entry: python3 scripts/rebuild/check_ccl_free_ingestion.py
        language: system
        files: ^(smartmetadata-ingestion/|scripts/rebuild/check_ccl_free_ingestion\.py)
        pass_filenames: false
        require_serial: true
      - id: ccl-free-mcp
        name: Clean-room MCP must not import official CCL MCP
        description: Fails if smartmetadata-mcp depends on or mentions openmetadata-mcp. See docs/rebuild/PHASE10.md.
        entry: python3 scripts/rebuild/check_ccl_free_mcp.py
        language: system
        files: ^(smartmetadata-mcp/|scripts/rebuild/check_ccl_free_mcp\.py)
        pass_filenames: false
        require_serial: true
      - id: product-path-hints
        name: Product-path misuse guards still present
        description: Fails if PRODUCT_PATH.md, the docker I_UNDERSTAND_CCL_INGESTION ack, or the README pointer is missing. Does not re-scan openmetadata-dist (see ccl-free-dist).
        entry: python3 scripts/rebuild/test_check_product_path_hints.py
        language: system
        files: ^(docs/rebuild/PRODUCT_PATH\.md|docs/decisions/2026-10-22-ccl-trees-stay-reference-only\.md|README\.md|docker/run_local_docker_common\.sh|scripts/rebuild/check_product_path_hints\.py|scripts/rebuild/test_check_product_path_hints\.py)
        pass_filenames: false
        require_serial: true
      - id: verify-rebuild-contract
        name: Offline rebuild verify runner still covers the Phase 11 matrix
        description: Fails if scripts/rebuild/verify_rebuild.py drops a required offline step. See docs/rebuild/PHASE11.md.
        entry: python3 scripts/rebuild/test_verify_rebuild.py
        language: system
        files: ^(scripts/rebuild/verify_rebuild\.py|scripts/rebuild/test_verify_rebuild\.py|scripts/rebuild/check_product_path_hints\.py)
        pass_filenames: false
        require_serial: true
      - id: rebuild-ci-contract
        name: SmartMetadata rebuild CI stays a separate offline+GHA surface
        description: Fails if the dedicated rebuild workflow reuses Collate/Playwright/ingestion-image CI, or if live_smoke.py starts Docker. See docs/rebuild/VERIFY_RUNTIME.md.
        entry: bash -c 'python3 scripts/rebuild/test_live_smoke.py && python3 scripts/rebuild/test_rebuild_workflows.py'
        language: system
        files: ^(scripts/rebuild/live_smoke\.py|scripts/rebuild/test_live_smoke\.py|scripts/rebuild/test_rebuild_workflows\.py|\.github/workflows/smartmetadata-rebuild\.yml)
        pass_filenames: false
        require_serial: true
      - id: java-impact-map
        name: Java impact map owns the code and ITs this branch adds
        description: Fails the push while the branch leaves Java code or ITs without an area in .github/java-tests/impact-map.json, empties a pattern or breaks a map rule. The message names the glob to add and the likely area.
        # The commit being pushed, not the working tree: an unstaged map fix must not pass.
        entry: bash -c 'python3 .github/scripts/plan_local_java_tests.py --check-branch --head "${PRE_COMMIT_TO_REF:-HEAD}"'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
