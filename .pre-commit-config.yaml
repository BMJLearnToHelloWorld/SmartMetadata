default_language_version:
  python: python3
# `pre-commit install` also installs the pre-push hook java-impact-map needs; every other
# hook keeps running at commit only.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
        # TODO: investigate and fix or remove the excluded files. The first
        # three carry real JSON issues (duplicate keys, malformed/empty
        # content) that pre-commit-hooks v2.3.0 didn't catch; v5.0.0 does.
        # The last is an intentionally malformed test fixture.
        exclude: |
          (?x)^(
            .*vscode.*|
            openmetadata-spec/src/main/resources/rdf/contexts/dataAsset\.jsonld|
            openmetadata-service/src/main/resources/dataInsights/opensearch/indexSettingsTemplate\.json
          )$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        name: ruff-check (smartmetadata-ingestion)
        files: ^smartmetadata-ingestion/
        args: ["--fix", "--config", "smartmetadata-ingestion/pyproject.toml"]
      - id: ruff-format
        name: ruff-format (smartmetadata-ingestion)
        files: ^smartmetadata-ingestion/
        args: ["--config", "smartmetadata-ingestion/pyproject.toml"]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.5.1
    hooks:
      - id: prettier
        files: ^openmetadata-service/src/main/resources/json/schema/
  - repo: local
    hooks:
      - id: google-style-java
        name: Google Java Code Style for Java
        description: Formats code in Google's Java codestyle with 120 line length.
        entry: scripts/format-code.sh
        language: script
        files: \.java$
        require_serial: true
      - id: decision-records
        name: Decision records (docs/decisions/ format, ADR citations)
        description: Fails if a record under docs/decisions/ breaks the format, or an ADR citation or docs/decisions/ path in any tracked file resolves to no record. See docs/decisions/README.md.
        entry: python3 scripts/harness/check_decision_records.py
        language: system
        pass_filenames: false
        require_serial: true
      - id: ccl-free-dist
        name: Shippable dist must not depend on CCL modules
        description: Fails if openmetadata-dist declares or packages openmetadata-ui, openmetadata-mcp, ui-core-components, or ingestion. See docs/rebuild/PHASE0.md.
        entry: python3 scripts/rebuild/check_ccl_free_dist.py
        language: system
        files: ^(openmetadata-dist/|scripts/rebuild/check_ccl_free_dist\.py)
        pass_filenames: false
        require_serial: true
      - id: ccl-free-ingestion
        name: Clean-room ingestion must not import CCL packages
        description: Fails if smartmetadata-ingestion depends on or imports openmetadata-ingestion / metadata / openmetadata-airflow-apis. See docs/rebuild/PHASE6.md.
        entry: python3 scripts/rebuild/check_ccl_free_ingestion.py
        language: system
        files: ^(smartmetadata-ingestion/|scripts/rebuild/check_ccl_free_ingestion\.py)
        pass_filenames: false
        require_serial: true
      - id: ccl-free-mcp
        name: Clean-room MCP must not import official CCL MCP
        description: Fails if smartmetadata-mcp depends on or mentions openmetadata-mcp. See docs/rebuild/PHASE10.md.
        entry: python3 scripts/rebuild/check_ccl_free_mcp.py
        language: system
        files: ^(smartmetadata-mcp/|scripts/rebuild/check_ccl_free_mcp\.py)
        pass_filenames: false
        require_serial: true
      - id: purged-trees
        name: Purged CCL trees must not reappear
        description: Fails if official CCL / Collate-image trees return, or if the reactor/Makefile still lists them. See docs/rebuild/PRODUCT_PATH.md.
        entry: python3 scripts/rebuild/test_check_purged_trees.py
        language: system
        files: ^(pom\.xml|Makefile|scripts/rebuild/check_purged_trees\.py|scripts/rebuild/test_check_purged_trees\.py)
        pass_filenames: false
        require_serial: true
      - id: product-path-hints
        name: Product-path docs and docker refusal still present
        description: Fails if PRODUCT_PATH.md, the docker -i true refusal, or the README pointer is missing. Does not re-scan openmetadata-dist (see ccl-free-dist).
        entry: python3 scripts/rebuild/test_check_product_path_hints.py
        language: system
        files: ^(docs/rebuild/PRODUCT_PATH\.md|docs/rebuild/PARITY\.md|docs/decisions/2026-10-22-ccl-trees-are-purged\.md|README\.md|docker/run_local_docker_common\.sh|scripts/rebuild/check_product_path_hints\.py|scripts/rebuild/test_check_product_path_hints\.py)
        pass_filenames: false
        require_serial: true
      - id: verify-rebuild-contract
        name: Offline rebuild verify runner still covers the Phase 11 matrix
        description: Fails if scripts/rebuild/verify_rebuild.py drops a required offline step. See docs/rebuild/PHASE11.md.
        entry: python3 scripts/rebuild/test_verify_rebuild.py
        language: system
        files: ^(scripts/rebuild/verify_rebuild\.py|scripts/rebuild/test_verify_rebuild\.py|scripts/rebuild/check_product_path_hints\.py|scripts/rebuild/check_purged_trees\.py)
        pass_filenames: false
        require_serial: true
      - id: rebuild-ci-contract
        name: SmartMetadata rebuild CI stays a separate offline+GHA surface
        description: Fails if the dedicated rebuild workflow reuses Collate/Playwright/ingestion-image CI, or if live_smoke.py starts Docker. See docs/rebuild/VERIFY_RUNTIME.md.
        entry: bash -c 'python3 scripts/rebuild/test_live_smoke.py && python3 scripts/rebuild/test_rebuild_workflows.py'
        language: system
        files: ^(scripts/rebuild/live_smoke\.py|scripts/rebuild/test_live_smoke\.py|scripts/rebuild/test_rebuild_workflows\.py|\.github/workflows/smartmetadata-rebuild\.yml)
        pass_filenames: false
        require_serial: true
      - id: java-impact-map
        name: Java impact map owns the code and ITs this branch adds
        description: Fails the push while the branch leaves Java code or ITs without an area in .github/java-tests/impact-map.json, empties a pattern or breaks a map rule. The message names the glob to add and the likely area.
        # The commit being pushed, not the working tree: an unstaged map fix must not pass.
        entry: bash -c 'python3 .github/scripts/plan_local_java_tests.py --check-branch --head "${PRE_COMMIT_TO_REF:-HEAD}"'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
