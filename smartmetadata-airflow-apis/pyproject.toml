[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartmetadata-airflow-apis"
version = "0.1.0"
description = "Clean-room Airflow managed API routes matching Java AirflowRESTClient"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "flask>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
# The workflow builders (workflows/) run the product ingestion package;
# the standalone Flask app does not need it.
workflows = ["smartmetadata-ingestion"]

[tool.setuptools.packages.find]
where = ["src"]

# The dag_runner template is data, not code: without this it is missing
# from built wheels and deploy cannot render DAG files.
[tool.setuptools.package-data]
smartmetadata_airflow_apis = ["resources/*.jinja"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
