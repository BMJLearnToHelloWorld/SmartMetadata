# Disabled. This workflow used to dispatch OpenMetadata Collate Tests to
# open-metadata/openmetadata-collate. Official CCL trees were purged from
# this repository (ADR:2026-10-22-ccl-trees-are-purged). SmartMetadata must
# not contribute to or wait on Collate CI.
#
# Product rebuild CI: .github/workflows/smartmetadata-rebuild.yml
name: Maven Collate Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collate-disabled:
    name: Collate dispatch disabled
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse Collate dispatch
        run: |
          echo "maven-build-collate is disabled."
          echo "Official CCL trees were purged (ADR:2026-10-22-ccl-trees-are-purged)."
          echo "Do not dispatch to open-metadata/openmetadata-collate."
          echo "Product gate: .github/workflows/smartmetadata-rebuild.yml"
