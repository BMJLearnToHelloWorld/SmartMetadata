# Guardrail for `.github/playwright/impact-map.generated.json`.
#
# The Playwright PR planner reads this file alongside the hand-authored
# `impact-map.json` to route "if source X changes, run these specs". The
# generated half is a deterministic function of the current tree (spec
# imports + testId cross-reference), so drift means the committed file
# no longer matches what the generator would produce — usually because
# a spec, a shared helper, or a `data-testid` string changed and the
# author did not regenerate.
#
# Behaviour:
#
#   * Same-repo PR: regenerate with `--check`. If the committed
#     `impact-map.generated.json` matches, pass. If it drifts, fail and
#     tell the author to regenerate locally and push — do NOT auto-commit
#     or push from CI (COLLATE_PAT / writable tokens are often unset on
#     forks and private mirrors; relying on CI write caused false reds).
#
#   * Fork PR (pull_request_target with head_repo != base_repo):
#     no-op. External contributors are not asked to regenerate; the
#     "unmapped code -> full" fallback in select_playwright_tests still
#     covers them (see PR #32809).
#
# We deliberately do NOT run on `merge_group`. Same-repo PRs must land
# a fresh map before entering the queue; fork PRs use the unmapped
# fallback. A merge_group gate cannot push a fix onto a read-only ref.
#
# Trigger paths are the code the map is a function of: specs, UI src,
# and the generator itself. Anything else cannot change the output.

name: Playwright impact-map drift

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
    paths:
      - 'openmetadata-ui/src/main/resources/ui/playwright/e2e/**/*.spec.ts'
      - 'openmetadata-ui/src/main/resources/ui/src/**/*.ts'
      - 'openmetadata-ui/src/main/resources/ui/src/**/*.tsx'
      - '.github/scripts/generate_playwright_impact_map.py'
      - '.github/playwright/impact-map.generated.json'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to refresh the impact map for (optional)'
        required: false
        type: string

concurrency:
  group: playwright-impact-map-drift-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'pull_request_target' || github.event.action != 'labeled' || (github.event.label.name == 'safe to test' && github.event.pull_request.head.repo.full_name != github.repository) }}

jobs:
  impact-map-drift:
    name: Playwright impact-map drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Gate on the same `safe to test` label as typescript-type-generation
    # for fork PRs, so an untrusted fork cannot execute the generator
    # against base-repo secrets before a maintainer has looked at the diff.
    if: ${{ !github.event.pull_request.draft && (github.event_name != 'pull_request_target' || github.event.action != 'labeled' || github.event.label.name == 'safe to test') }}
    permissions:
      contents: read

    steps:
      - name: Get PR details for workflow_dispatch
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != ''
        id: pr-details
        env:
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          BASE_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_DATA=$(gh pr view "$PR_NUMBER" --json headRepository,headRefName,headRepositoryOwner,headRefOid --repo "$BASE_REPO")
          echo "head_ref=$(echo "$PR_DATA" | jq -r '.headRefName')" >> $GITHUB_OUTPUT
          echo "head_sha=$(echo "$PR_DATA" | jq -r '.headRefOid')" >> $GITHUB_OUTPUT
          echo "full_repo=$(echo "$PR_DATA" | jq -r '.headRepositoryOwner.login + "/" + .headRepository.name')" >> $GITHUB_OUTPUT

      - name: Classify fork vs same-repo
        id: check-fork
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_REPO: ${{ steps.pr-details.outputs.full_repo }}
          HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ] && [ -n "$FULL_REPO" ]; then
            if [ "$FULL_REPO" != "$BASE_REPO" ]; then
              echo "is_fork=true" >> $GITHUB_OUTPUT
            else
              echo "is_fork=false" >> $GITHUB_OUTPUT
            fi
          elif [ "$EVENT_NAME" == "pull_request_target" ]; then
            if [ "$HEAD_REPO_FULL_NAME" != "$BASE_REPO" ]; then
              echo "is_fork=true" >> $GITHUB_OUTPUT
            else
              echo "is_fork=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "is_fork=false" >> $GITHUB_OUTPUT
          fi

      # Fork PRs are a no-op past this point — see the header docstring
      # for the rationale. The step below records the reason in the log so
      # a reviewer looking at the run can see why nothing else fired.
      - name: Skip on fork PRs
        if: steps.check-fork.outputs.is_fork == 'true'
        run: |
          echo "Fork PR detected — impact-map drift is a no-op on forks."
          echo "The 'unmapped code → full' fallback in select_playwright_tests still"
          echo "runs the specs a stale map would have routed to (see PR #32809)."

      - name: Determine checkout ref
        if: steps.check-fork.outputs.is_fork != 'true'
        id: checkout-ref
        env:
          IS_FORK: ${{ steps.check-fork.outputs.is_fork }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_DETAILS_HEAD_SHA: ${{ steps.pr-details.outputs.head_sha }}
          PR_DETAILS_HEAD_REF: ${{ steps.pr-details.outputs.head_ref }}
          GITHUB_SHA_VAL: ${{ github.sha }}
        run: |
          if [ "$IS_FORK" == "true" ] && [ "$EVENT_NAME" == "pull_request_target" ]; then
            echo "ref=$PR_HEAD_SHA" >> $GITHUB_OUTPUT
          elif [ "$EVENT_NAME" == "pull_request_target" ]; then
            echo "ref=$PR_HEAD_REF" >> $GITHUB_OUTPUT
          elif [ "$IS_FORK" == "true" ] && [ -n "$PR_DETAILS_HEAD_SHA" ]; then
            echo "ref=$PR_DETAILS_HEAD_SHA" >> $GITHUB_OUTPUT
          elif [ -n "$PR_DETAILS_HEAD_REF" ]; then
            echo "ref=$PR_DETAILS_HEAD_REF" >> $GITHUB_OUTPUT
          else
            echo "ref=$GITHUB_SHA_VAL" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.check-fork.outputs.is_fork != 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.pr-details.outputs.full_repo || github.repository }}
          ref: ${{ steps.checkout-ref.outputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false

      - name: Setup Python
        if: steps.check-fork.outputs.is_fork != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check impact map is up to date
        if: steps.check-fork.outputs.is_fork != 'true'
        run: |
          python3 .github/scripts/generate_playwright_impact_map.py --check

      # No fork-PR comment. External contributors are not asked to install
      # Python and regenerate the map locally — the "unmapped code → full"
      # fallback still routes the specs a fresh map would have.
