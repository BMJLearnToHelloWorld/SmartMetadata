[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartmetadata-ingestion"
version = "0.6.0"
description = "Clean-room Apache-2.0 metadata ingestion for SmartMetadata (OpenMetadata server REST)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "SmartMetadata authors" }]
keywords = ["metadata", "openmetadata", "ingestion", "catalog"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
smartmetadata-ingest = "smartmetadata_ingestion.cli:main"

[project.urls]
Homepage = "https://github.com/BMJLearnToHelloWorld/SmartMetadata"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["smartmetadata_ingestion"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
