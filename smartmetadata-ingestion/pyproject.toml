[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartmetadata-ingestion"
version = "0.7.0"
description = "Clean-room Apache-2.0 metadata ingestion for SmartMetadata (OpenMetadata server REST)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "SmartMetadata authors" }]
keywords = ["metadata", "openmetadata", "ingestion", "catalog"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
  "pyyaml>=6,<7",
  # SQL parsing engine for the usage/lineage clean-room chain (MIT; the
  # same version the pin uses, so cascade behavior matches). Core, not
  # an extra: usage/lineage run for every database connector.
  # ADR:2026-11-14-agent-capability-batch1
  "collate-sqllineage==2.1.9",
]

[project.optional-dependencies]
# postgres: metadata uses psycopg3; companions/OM wire use psycopg2 + GeoAlchemy2 + packaging (OM plugins["postgres"]).
postgres = [
  "psycopg[binary]>=3.1,<4",
  "psycopg2-binary",
  "GeoAlchemy2",
  "packaging",
]
# mysql: OM also lists cloud-sql-python-connector[pymysql] + collate-data-diff — SM omits both (unused / OutOfScope).
mysql = ["pymysql>=1.1,<2"]
# snowflake: SM imports snowflake.connector (not snowflake-sqlalchemy). OM plugins pin snowflake-sqlalchemy which pulls the connector; keep connector pin matching code.
snowflake = ["snowflake-connector-python>=3.12,<4"]
# kafka/redpanda: OM uses confluent-kafka[schemaregistry]; SM KafkaSampler/RedpandaSampler use kafka-python — keep code-matching extra (documented residual).
kafka = ["kafka-python>=2.0,<3"]
redpanda = ["kafka-python>=2.0,<3"]
databricks = [
  "databricks-sql-connector>=3.0,<5",
  "databricks-sdk>=0.30,<1",
  "databricks-sqlalchemy>=1.0,<3",
  "thrift>=0.13,<1",
  "ndg-httpsclient>=0.5.1,<1",
  "pyOpenSSL>=23,<26",
  "pyasn1>=0.4,<1",
]
doris = [
  "pydoris==1.2.0",
  "pymysql>=1.1,<2",
]
mssql = ["sqlalchemy-pytds~=1.0"]
mssql-odbc = ["pyodbc~=5.3"]
mssql-pymssql = ["pymssql~=2.3.9"]
# trino: OM plugins["trino"] is bare trino[sqlalchemy]; SM live reads use trino.dbapi directly.
trino = ["trino[sqlalchemy]"]
# clickzetta: OM pins clickzetta-connector==1.0.30 (+ clickzetta-sqlalchemy, unused here — SM has no SQLAlchemy engine for ClickZetta).
clickzetta = ["clickzetta-connector==1.0.30"]
# azuresql: no new extra — its TDS drivers come from mssql / mssql-odbc / mssql-pymssql.

mariadb = ["pymysql>=1.1,<2"]
redshift = [
  "sqlalchemy-redshift~=1.0.0",
  "psycopg2-binary",
  "GeoAlchemy2",
]
greenplum = [
  "pymysql>=1.1,<2",
  "psycopg2-binary",
  "GeoAlchemy2",
  "packaging",
]
timescale = [
  "psycopg2-binary",
  "GeoAlchemy2",
  "packaging",
]
prefect = []
dagster = [
  "dagster_graphql>=1.8.0",
]
s3 = [
  "boto3>=1.43.101,<2",
  "pandas>=2.0,<3",
  "pyarrow>=14,<22",
  "rarfile>=4,<5",
  "py7zr>=0.20,<2",
  "brotli>=1.0,<2",
]
# autoclassification: clean-room PII engine (Presidio + spaCy, both MIT;
# python-dateutil, dual Apache-2.0/BSD-3-Clause). The date rules are
# defined by the dateutil parser (supplement §4), so it is declared
# here rather than emulated; without it the engine falls back to the
# stdlib emulation with a loud warning.
# Optional: the core suite runs without it; an autoClassification run fails
# loud when the engine is needed but the extra is absent, and a missing
# spaCy model fails loud at run start (no runtime download).
# ADR:2026-11-14-autoclassification-engine
autoclassification = [
  "presidio-analyzer==2.2.358",
  "python-dateutil==2.9.0.post0",
  "spacy>=3.8.2,<3.9",
  "preshed<3.0.14",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
smartmetadata-ingest = "smartmetadata_ingestion.cli:main"

[project.urls]
Homepage = "https://github.com/BMJLearnToHelloWorld/SmartMetadata"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["smartmetadata_ingestion"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
